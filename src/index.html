<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
</head>
<body class="bg-white text-gray-900 font-sans">
    <header class="flex items-center justify-between px-6 py-4 border-b">
      <h1 class="text-xl font-bold text-blue-900">formcarry.</h1>
      <nav class="hidden md:flex space-x-6 text-sm text-gray-700">
        <a href="#" class="hover:text-blue-600">FAQ</a>
        <a href="#" class="hover:text-blue-600">Docs</a>
        <a href="#" class="hover:text-blue-600">Integrations</a>
        <a href="#" class="hover:text-blue-600">Pricing</a>
      </nav>
      <div class="space-x-2 hidden md:flex">
        <button class="text-sm text-gray-700 hover:text-blue-600">Login</button>
        <button class="bg-blue-900 text-white px-4 py-1 rounded-full text-sm hover:bg-blue-800">Sign up</button>
      </div>
    </header>
    <main class="flex flex-col items-center text-center px-4 md:px-8 lg:px-24 py-16">
        <p class="text-[20px] text-blue-900 font-semibold">COLLECT FORM SUBMISSIONS</p>
      <h2 class="text-3xl md:text-5xl font-semibold mb-4">
        Get emails and messages<br class="hidden md:block" /> from your HTML form
      </h2>
      <p class="text-base md:text-lg text-gray-600 max-w-2xl">
        Code your own HTML form and style it, then point your form to formcarry to get email notifications,
        upload files, block spam and integrate with other apps.
      </p>
      <div class="mt-8 bg-white shadow-lg p-4 rounded-full flex items-center w-full max-w-md">
        <input type="email" placeholder="Your email address"
               class="flex-grow px-4 py-2 rounded-full focus:outline-none" />
        <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-full ml-2">
          Get Started
        </button>
      </div>
      <div>
        <img src="/image copy.png" alt="">
      </div>
      <button class="bg-[#0b0c3f] text-white text-sm px-6 h-[80px] rounded-2xl shadow-md">
        Endpoint copied to clipboard 👏
      </button>
    </main>

</body>
</html>
